<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="pink">
   <center>
   <style>
</style>
    <h1 style="color:brown"><center>Registration form</center></h1>
      <form style="border: 2px solid black; padding: 10px; width: 600px;" method="get">
         <table border="0">
            <tr>
               <label>
               <td> Student Name:</td>
                <td><input name="First name" placeholder="First name" autocomplete="name" /></td>
                <td><input name="last name" placeholder="Last name" autocomplete="name" /></td>
               </label>
            </tr>
            <tr>
               <label>
                 <td>Father Name:</td>
                 <td><input name="submitted-father-name" autocomplete="father name " /></td>
                 </label>
            </tr>
            <tr>
               <label>
                 <td>Mother Name:</td>
                 <td><input name="submitted-mother-name" autocomplete="mother name" /></td>
               </label>
            </tr>
            <tr>
               <label>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="Male" value="yes" /> Male
                    <input type="radio" name="Female" value="no" /> female
                </td>
               </label>
            <tr>
               <label>
                 <td>email:</td>
                 <td><input input="submitted-email" autocomplete="email"></td>
               </label>
            </tr>
            <tr>
               <label>
                  <td>DOB:</td>
                  <td><input type="date" input="date-of-birth"></td>
               </label>
            </tr>
             <tr>
               <lable>
                  <td>Branch:</td>
                  <td>
                     <select value="" name="course">
                     <option value="">Select current Cours</option>
                     <option value="btech">B.Tech</option>
                     <option value="bsc">B.SC</option>
                     <option value="BBA">B.AA</option>
                     <option value="MBA">MBA</option>
                  </td>
                  </select>
            <tr>
               <lable>
                  <td>Course:</td>
                  <td><input type="checkbox" >CSE <input type="checkbox" >ME <input type="checkbox" >ECE <input type="checkbox" >IT</td>
               </lable>
            </tr>
               </lable>
            </tr>
            <tr>
               <td>Student Photo:</td>
               <td><input type="file" name="student photo"</td>
            </tr>
            <tr>
               <td>Student State/City:</td>
               <td><input type="text" name="City" placeholder="State"></td>
               <td><input type="text" name="State" placeholder="City"></td>
            </tr>
            <tr align="center">
            <td colspan="3"><button >REGISTOR</button></td>
            </tr>
         </table>
      </form>
      </center>
</body>
</html>
